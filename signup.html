<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niz & She | Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- NAVIGATION -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Niz & She
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="login.html" class="nav-button">
                Log In
            </a>

        </nav>

    </header>


    <!-- SIGN UP -->

    <main class="auth-wrapper">

        <div class="auth-background">

            <div class="bg-orb orb-one"></div>
            <div class="bg-orb orb-two"></div>

            <div class="grid-background"></div>

        </div>


        <section class="auth-card signup-card">

            <p class="eyebrow">
                NIZ & SHE
            </p>

            <h1>
                Create an account.
            </h1>

            <p class="auth-description">
                Create your account to enter our space.
            </p>


            <form>

                <label for="fullname">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required>


                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Choose a username"
                    required>


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>


                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="form-switch">

                Already have an account?

                <a href="login.html">
                    Log In
                </a>

            </p>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            Niz & She
        </div>

        <p>
            © 2026 Niz & She
        </p>

    </footer>

        </section>

    <footer>
        <p>© 2026 Niz & She</p>
    </footer>


    <!-- CINEMATIC MUSIC PLAYER -->

    <div class="music-player">

        <div class="music-info">

            <span class="music-label">
                NOW PLAYING
            </span>

            <span class="music-title">
                Yellow — Coldplay
            </span>

        </div>

        <audio controls loop>
            <source src="yellow.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

    </div>


</body>

</html>
