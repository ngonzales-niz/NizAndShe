<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niz & She | Log In</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


    <!-- NAVIGATION -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Niz & She
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="signup.html" class="nav-button">
                Sign Up
            </a>

        </nav>

    </header>


    <!-- LOGIN -->

    <main class="auth-wrapper">

        <div class="auth-background">

            <div class="bg-orb orb-one"></div>
            <div class="bg-orb orb-two"></div>

            <div class="grid-background"></div>

        </div>


        <section class="auth-card">

            <p class="eyebrow">
                NIZ & SHE
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="auth-description">
                Log in to continue.
            </p>


            <form>

                <label for="login-user">
                    Email or Username
                </label>

                <input
                    type="text"
                    id="login-user"
                    placeholder="Enter your email or username"
                    required>


                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required>


                <button type="submit">
                    Log In
                </button>

            </form>


            <p class="form-switch">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            Niz & She
        </div>

        <p>
            © 2026 Niz & She
        </p>

    </footer>

        </section>

    <footer>
        <p>© 2026 Niz & She</p>
    </footer>


    <!-- CINEMATIC MUSIC PLAYER -->

    <div class="music-player">

        <div class="music-info">

            <span class="music-label">
                NOW PLAYING
            </span>

            <span class="music-title">
                Yellow — Coldplay
            </span>

        </div>

        <audio controls loop>
            <source src="yellow.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

    </div>

</body>

</html>
